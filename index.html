<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7a95d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Coast Salish Formline Carving Canvas</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
      :root {
        color-scheme: light;
        --cedar-deep: #8e5a32;
        --cedar-light: #efc77f;
        --charcoal: #231b15;
        --cream: #f8f1df;
        --text: rgba(35, 27, 21, 0.88);
        --panel: rgba(248, 241, 223, 0.72);
        --panel-border: rgba(35, 27, 21, 0.16);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--cedar-light);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      #gameCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }

      .canvas-label {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        top: max(14px, env(safe-area-inset-top));
        z-index: 5;
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px 14px;
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 16px 44px rgba(35, 27, 21, 0.18);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        pointer-events: none;
      }

      .canvas-label strong {
        display: block;
        margin-bottom: 2px;
        color: var(--charcoal);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .canvas-label span {
        display: block;
        font-size: 12px;
        line-height: 1.4;
        color: rgba(35, 27, 21, 0.66);
      }

      #canvas-status {
        position: fixed;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        z-index: 5;
        transform: translateX(-50%);
        width: max-content;
        max-width: min(560px, calc(100vw - 32px));
        padding: 10px 14px;
        border: 1px solid rgba(35, 27, 21, 0.14);
        border-radius: 999px;
        background: rgba(248, 241, 223, 0.68);
        box-shadow: 0 14px 38px rgba(35, 27, 21, 0.16);
        color: rgba(35, 27, 21, 0.72);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-align: center;
        pointer-events: none;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .start-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: min(32px, 5vw);
        box-sizing: border-box;
        background:
          radial-gradient(720px 420px at 50% 42%, rgba(248, 241, 223, 0.56), rgba(186, 85, 54, 0.18) 56%, transparent 70%),
          rgba(35, 27, 21, 0.12);
        backdrop-filter: blur(9px);
        -webkit-backdrop-filter: blur(9px);
        transition: opacity 360ms ease;
      }

      .start-overlay[hidden] {
        display: none !important;
      }

      .start-overlay.is-exiting {
        opacity: 0;
        pointer-events: none;
      }

      .start-card {
        width: min(430px, 100%);
        padding: 24px;
        border: 1px solid rgba(35, 27, 21, 0.17);
        border-radius: 22px;
        background: rgba(248, 241, 223, 0.84);
        box-shadow: 0 24px 70px rgba(35, 27, 21, 0.28);
        text-align: center;
      }

      .start-card h1 {
        margin: 0 0 10px;
        color: var(--charcoal);
        font-size: clamp(24px, 7vw, 38px);
        line-height: 1.02;
        letter-spacing: 0.01em;
      }

      .start-card p {
        margin: 0 0 18px;
        color: rgba(35, 27, 21, 0.72);
        font-size: 14px;
        line-height: 1.5;
      }

      .start-card button {
        appearance: none;
        width: 100%;
        min-height: 48px;
        border: 1px solid rgba(35, 27, 21, 0.28);
        border-radius: 15px;
        background: linear-gradient(160deg, #231b15, #4a2b1f);
        color: #f8f1df;
        cursor: pointer;
        font: 800 14px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 14px 34px rgba(35, 27, 21, 0.28);
      }

      .start-card button:focus-visible {
        outline: 3px solid rgba(186, 85, 54, 0.72);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="Single-screen Coast Salish formline carving canvas"></canvas>

    <div class="canvas-label" aria-hidden="true">
      <strong>Formline Carving Canvas</strong>
      <span>Tap the moving red cedar snag; each strike opens the next ST'ÉXEM section.</span>
    </div>

    <div id="canvas-status" aria-live="polite">Center your gaze on the steady cedar sweep.</div>

    <div id="start-overlay" class="start-overlay" role="dialog" aria-modal="true" aria-labelledby="start-heading">
      <div class="start-card">
        <h1 id="start-heading">Coast Salish Formline Carving Canvas</h1>
        <p>
          A single yellow cedar block, one horizontal ST'ÉXEM composition, and a steady red cedar sweep
          for calm tactile focus.
        </p>
        <button id="start-button" type="button" autofocus>Begin carving</button>
      </div>
    </div>

    <script src="js/haptics.js"></script>
    <script src="js/engine.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
  </body>
</html>
